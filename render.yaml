# ══════════════════════════════════════════════════════════
# THE SYSTEM — Render Blueprint (render.yaml)
# ══════════════════════════════════════════════════════════
# Defines two services:
#   1. Telegram Bot  → Background Worker (always running)
#   2. Dashboard     → Web Service (Streamlit UI)
# ══════════════════════════════════════════════════════════

services:
  # ── Telegram Bot (Background Worker) ───────────────────
  - type: worker
    name: the-system-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python run_bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Streamlit Dashboard (Web Service) ──────────────────
  - type: web
    name: the-system-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run ui/dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
